[build]
  command = "pnpm --filter @workspace/martial-arts-studio... run build"
  publish = "artifacts/martial-arts-studio/dist/public"

[build.environment]
  NODE_VERSION = "24"
  BASE_PATH = "/"

# Single-page app: serve index.html for client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
